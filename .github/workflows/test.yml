name: verify
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile src/vps_vk.py
      - run: bash -n install.sh scripts/build-freeturn.sh
      - name: Verify bundled artifacts and archive
        run: python3 scripts/verify-package.py
